<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="orb">
      <circle cx="50" cy="50" r="48"/>
    </clipPath>

    <linearGradient id="shader-base" x1="18" y1="8" x2="82" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e64553"/>
      <stop offset="0.22" stop-color="#ea76cb"/>
      <stop offset="0.48" stop-color="#8839ef"/>
      <stop offset="0.74" stop-color="#1e66f5"/>
      <stop offset="1" stop-color="#7287fd"/>
    </linearGradient>

    <radialGradient id="pink-bloom" cx="58%" cy="16%" r="62%">
      <stop offset="0" stop-color="#ea76cb" stop-opacity="0.92"/>
      <stop offset="0.56" stop-color="#ea76cb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ea76cb" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="mauve-bloom" cx="86%" cy="34%" r="58%">
      <stop offset="0" stop-color="#8839ef" stop-opacity="0.82"/>
      <stop offset="0.62" stop-color="#8839ef" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8839ef" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blue-bloom" cx="44%" cy="89%" r="62%">
      <stop offset="0" stop-color="#1e66f5" stop-opacity="0.96"/>
      <stop offset="0.66" stop-color="#1e66f5" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#1e66f5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="warm-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fe640b" stop-opacity="0"/>
      <stop offset="0.27" stop-color="#fe640b" stop-opacity="0"/>
      <stop offset="0.43" stop-color="#fe640b" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#df8e1d" stop-opacity="0.94"/>
      <stop offset="0.68" stop-color="#fe640b" stop-opacity="0.45"/>
      <stop offset="0.83" stop-color="#fe640b" stop-opacity="0"/>
      <stop offset="1" stop-color="#fe640b" stop-opacity="0"/>
    </linearGradient>

    <filter id="grain" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" seed="24" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="soft-grain">
        <feFuncA type="table" tableValues="0 0.13"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="soft-grain" mode="soft-light"/>
    </filter>
  </defs>

  <g clip-path="url(#orb)" filter="url(#grain)">
    <rect width="100" height="100" fill="url(#shader-base)"/>
    <rect width="100" height="100" fill="url(#pink-bloom)"/>
    <rect width="100" height="100" fill="url(#mauve-bloom)"/>
    <rect width="100" height="100" fill="url(#blue-bloom)"/>
    <rect x="-28" y="-24" width="156" height="148" fill="url(#warm-band)" transform="rotate(17 50 50)"/>
    <circle cx="39" cy="19" r="38" fill="#ffffff" opacity="0.08"/>
    <circle cx="50" cy="50" r="47.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  </g>
</svg>

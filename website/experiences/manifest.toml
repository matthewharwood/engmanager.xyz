# Web API Experiences — canonical manifest.
#
# Source of truth for `website/js/src/experiences.js`. A Rust unit test
# (website/src/experiences.rs) asserts every `id` here has a matching
# `id: "..."` entry in the JS file. Add a row here and the build will
# fail until the JS catches up.
#
# `group` matches the bucket the entry appears under in the DevTools
# Web API Receipt and the brutalist receipt modal.


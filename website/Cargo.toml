[package]
name = "website"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
rust-embed = { workspace = true }
listenfd = { workspace = true, optional = true }
pulldown-cmark = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
eng-markup = { workspace = true }
eng-domain = { workspace = true }
tantivy = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
uuid = { workspace = true }
surrealdb = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
lightningcss = { workspace = true }
oxc_allocator = { workspace = true }
oxc_codegen = { workspace = true }
oxc_mangler = { workspace = true }
oxc_minifier = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }

[dev-dependencies]
# Router-surface regression tests drive the real Router with
# tower::ServiceExt::oneshot and read bodies via http-body-util.
http-body-util = "0.1"
roxmltree = "0.20"
tower = { version = "0.5", features = ["util"] }

[features]
# Enables live-reload via systemfd's LISTEN_FDS socket inheritance.
# Used by `just dev` only. Production (`cargo build --release`) leaves
# this off so `listenfd` is not linked into the binary at all.
dev = ["dep:listenfd"]

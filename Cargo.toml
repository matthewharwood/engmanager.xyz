[workspace]
members = ["website"]
resolver = "3"

[workspace.dependencies]
axum = "0.8.7"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
rust-embed = { version = "8", features = ["mime-guess", "interpolate-folder-path"] }
listenfd = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip"] }
tantivy = "0.26.1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
surrealdb = { version = "3.1.0-beta.3", default-features = false, features = ["kv-mem", "kv-surrealkv", "protocol-ws", "rustls"] }
lightningcss = "1.0.0-alpha.69"
oxc_allocator = "0.131"
oxc_codegen = "0.131"
oxc_mangler = "0.131"
oxc_minifier = "0.131"
oxc_parser = "0.131"
oxc_span = "0.131"

# eng-markup proc-macros + eng-domain runtime types, pulled from auteur-rs.
# eng-domain MUST be a direct dep of any crate that uses view!/html!, because
# the macros expand to absolute paths `::eng_domain::*`.
eng-markup = { git = "https://github.com/eng-manager-xyz/auteur-rs", rev = "cd7fe0b5f2adcada37eae68f5652e8c9c75c7386" }
eng-domain = { git = "https://github.com/eng-manager-xyz/auteur-rs", rev = "cd7fe0b5f2adcada37eae68f5652e8c9c75c7386" }

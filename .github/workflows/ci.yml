name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Cargo.lock is gitignored, so resolution happens per run; keep the
  # incremental cache off for a smaller, more reusable target dir.
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: fmt · clippy · test (unit + integration + browser)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned nightly (rust-toolchain.toml)
        run: |
          channel=$(sed -nE 's/^channel = "(.*)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup override set "$channel"
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Personality scoring, serialization, storage, PDF, and offline tests
        run: |
          npm ci --prefix scripts --ignore-scripts
          npm test --prefix scripts
          node scripts/personality-release.mjs --verify-published
          node scripts/personality-release.mjs
          git diff --exit-code -- website/assets/personality/v2/release.mjs

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy -p website --all-targets -- -D warnings

      - name: Tests
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          echo "CHROME_BIN=$CHROME_BIN"
          cargo test -p website
        env:
          # The headless-Chrome integration test must run in CI, not skip.
          REQUIRE_BROWSER_TESTS: "1"
